<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Accident Detector</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}
    header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:12px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ff4444}
    header h1{font-size:1.2rem;color:#fff;font-weight:700;flex:1}
    .back-btn{background:#1a1a35;border:1px solid #2a2a50;color:#ccc;padding:7px 14px;border-radius:8px;font-size:0.8rem;cursor:pointer;text-decoration:none;transition:all 0.2s}
    .back-btn:hover{border-color:#4a90e2;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px}
    .stat-card{background:#12122a;border:1px solid #1e1e3f;border-radius:14px;padding:20px;text-align:center}
    .stat-card .val{font-size:2rem;font-weight:800;margin-bottom:4px}
    .stat-card .lbl{font-size:0.75rem;color:#666;text-transform:uppercase;letter-spacing:1px}
    .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 24px 24px}
    .chart-card{background:#12122a;border:1px solid #1e1e3f;border-radius:14px;padding:20px}
    .chart-card h3{font-size:0.85rem;color:#aaa;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
    .chart-card.full{grid-column:span 2}
    canvas{max-height:240px}
    .highway-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
    .hw-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1a1a35;border-radius:8px;font-size:0.82rem}
    .hw-item .hw-name{color:#fff;font-weight:600}
    .hw-bar-wrap{flex:1;margin:0 12px;height:6px;background:#1e1e3f;border-radius:3px;overflow:hidden}
    .hw-bar{height:100%;background:linear-gradient(90deg,#ff4444,#ff8888);border-radius:3px}
    .hw-count{color:#888;font-size:0.75rem}
  </style>
</head>
<body>
<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff4444" stroke-width="2">
    <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
    <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
  </svg>
  <h1>📊 Analytics Dashboard</h1>
  <a href="/" class="back-btn">← Back to Map</a>
</header>

<div class="grid" id="stats-grid">
  <div class="stat-card"><div class="val" style="color:#ff4444" id="s-accidents">—</div><div class="lbl">Total Accidents</div></div>
  <div class="stat-card"><div class="val" style="color:#ff8888" id="s-fatalities">—</div><div class="lbl">Total Fatalities</div></div>
  <div class="stat-card"><div class="val" style="color:#ffaa44" id="s-zones">—</div><div class="lbl">Danger Zones</div></div>
  <div class="stat-card"><div class="val" style="color:#ff4444" id="s-high">—</div><div class="lbl">HIGH Risk Zones</div></div>
</div>

<div class="charts">
  <div class="chart-card">
    <h3>⏰ Accidents by Hour of Day</h3>
    <canvas id="hourChart"></canvas>
  </div>
  <div class="chart-card">
    <h3>🌦️ Accidents by Weather</h3>
    <canvas id="weatherChart"></canvas>
  </div>
  <div class="chart-card">
    <h3>🚨 Accidents by Severity</h3>
    <canvas id="severityChart"></canvas>
  </div>
  <div class="chart-card">
    <h3>🛣️ Accidents by Road Type</h3>
    <canvas id="roadChart"></canvas>
  </div>
  <div class="chart-card full">
    <h3>🏆 Most Dangerous Highway Segments</h3>
    <div class="highway-list" id="highway-list"></div>
  </div>
</div>

<script>
const C = { text:"#ccc", grid:"#1e1e3f", red:"#ff4444", orange:"orange", blue:"#4a90e2" };

fetch("/api/dashboard-stats").then(r=>r.json()).then(d=>{
  document.getElementById("s-accidents").textContent  = d.total_accidents.toLocaleString();
  document.getElementById("s-fatalities").textContent = d.total_fatalities.toLocaleString();
  document.getElementById("s-zones").textContent      = d.total_zones;
  document.getElementById("s-high").textContent       = d.high_risk_zones;

  // Hour chart
  new Chart(document.getElementById("hourChart"),{
    type:"bar",
    data:{
      labels: d.by_hour.map(h=>String(h.hour).padStart(2,"0")+":00"),
      datasets:[{label:"Accidents",data:d.by_hour.map(h=>h.count),
        backgroundColor: d.by_hour.map(h=>{
          const hr=h.hour;
          if(hr>=22||hr<=4) return "rgba(255,68,68,0.8)";
          if(hr>=17||hr<=7) return "rgba(255,165,0,0.8)";
          return "rgba(74,144,226,0.6)";
        }),borderRadius:4}]
    },
    options:{plugins:{legend:{display:false}},scales:{
      x:{ticks:{color:C.text,font:{size:9}},grid:{color:C.grid}},
      y:{ticks:{color:C.text},grid:{color:C.grid}}}}
  });

  // Weather chart
  new Chart(document.getElementById("weatherChart"),{
    type:"doughnut",
    data:{
      labels: d.by_weather.map(w=>w["Weather Conditions"]),
      datasets:[{data:d.by_weather.map(w=>w.count),
        backgroundColor:["#4a90e2","#ff4444","orange","#00c864","#9b59b6","#e67e22","#1abc9c","#e74c3c"],
        borderWidth:0}]
    },
    options:{plugins:{legend:{labels:{color:C.text,font:{size:11}}}}}
  });

  // Severity chart
  new Chart(document.getElementById("severityChart"),{
    type:"pie",
    data:{
      labels: d.by_severity.map(s=>s["Accident Severity"]),
      datasets:[{data:d.by_severity.map(s=>s.count),
        backgroundColor:["#4a90e2","orange","#ff4444"],borderWidth:0}]
    },
    options:{plugins:{legend:{labels:{color:C.text}}}}
  });

  // Road chart
  new Chart(document.getElementById("roadChart"),{
    type:"bar",
    data:{
      labels: d.by_road.map(r=>r["Road Type"]),
      datasets:[{label:"Accidents",data:d.by_road.map(r=>r.count),
        backgroundColor:"rgba(255,68,68,0.7)",borderRadius:6}]
    },
    options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{
      x:{ticks:{color:C.text},grid:{color:C.grid}},
      y:{ticks:{color:C.text},grid:{color:C.grid}}}}
  });

  // Highway list
  const maxFat = Math.max(...d.top_highways.map(h=>h.fatalities));
  const hwList = document.getElementById("highway-list");
  d.top_highways.forEach((h,i)=>{
    const pct = (h.fatalities/maxFat*100).toFixed(0);
    hwList.innerHTML+=`
      <div class="hw-item">
        <span class="hw-name">${i+1}. ${h.highway.replace(/_/g," ").replace("NH","NH-")}</span>
        <div class="hw-bar-wrap"><div class="hw-bar" style="width:${pct}%"></div></div>
        <span class="hw-count">${h.fatalities} fatalities</span>
      </div>`;
  });
});
</script>
</body>
</html>
